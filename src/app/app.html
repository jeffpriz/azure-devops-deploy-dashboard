<div class="app-shell">
  @if (showingConfig()) {
    <main class="config-page">
      <app-config-form [initialConfig]="config()" (configSubmit)="onConfigSubmit($event)" />
    </main>
  } @else if (config()) {
    <main class="dashboard-page">
      <app-dashboard
        [config]="config()!"
        (pipelineChange)="onPipelineChange($event)"
        (reconfigure)="onReconfigure()"
      />
    </main>
  }
</div>
